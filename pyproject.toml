[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sce-sr"
version = "0.1.0"
description = "Structure-first symbolic regression without ground-truth or formula library"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "SCE-SR"}]
dependencies = [
    "numpy>=1.23",
    "sympy>=1.11",
]

[project.optional-dependencies]
test = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["src"]
